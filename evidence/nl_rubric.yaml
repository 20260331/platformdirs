rubrics:
  - id: 1
    type: f2p
    text: platformdirs 为 appname、appauthor 和 version 提供可选的安全检查与规范化能力，并对三个字段采用一致规则。

  - id: 2
    type: f2p
    text: 启用安全模式后，应用标识不能使最终路径跳出平台规定的根目录。

  - id: 3
    type: f2p
    text: 启用安全模式后，路径分隔符、点目录、保留名称和首尾空白在各平台得到一致的拒绝或规范化结果，拒绝时的异常能够指出字段、输入值和原因。

  - id: 4
    type: f2p
    text: PlatformDirs 与接受 appname、appauthor 或 version 的独立目录函数使用同一安全模式规则。

  - id: 5
    type: p2p
    text: 未启用安全模式时，现有调用的参数含义、返回路径和异常行为保持兼容。
